<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FF8A00" />
    <title>badprompt — back soon</title>
    <meta name="description" content="badprompt is down for scheduled maintenance. Back shortly." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: ModeNine;
        src: url(/fonts/Modenine.woff2) format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: VT323;
        src: url(/fonts/VT323-Regular.ttf) format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --accent: #ff8a00;
        --ink: #0a0a0a;
        --paper: #f5f5f0;
        --edge: clamp(24px, 6vw, 110px);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { height: 100%; }

      body {
        background: var(--accent);
        color: var(--ink);
        font-family: ModeNine, VT323, "Cascadia Code", ui-monospace, monospace;
        overflow: hidden;
        position: relative;
      }

      /* halftone dots, fading from the corners like the main site */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle, var(--ink) 38%, transparent 42%);
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(ellipse at 0% 0%, #000 0%, transparent 38%),
          radial-gradient(ellipse at 100% 100%, #000 0%, transparent 38%);
        mask-image: radial-gradient(ellipse at 0% 0%, #000 0%, transparent 38%),
          radial-gradient(ellipse at 100% 100%, #000 0%, transparent 38%);
        pointer-events: none;
        opacity: 0.85;
      }

      /* vertical timeline line, same motif as the portfolio */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        bottom: 0;
        left: calc(var(--edge) - 28px);
        width: 2px;
        background: var(--ink);
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px var(--edge);
        gap: clamp(18px, 3.5vh, 36px);
      }

      .brand {
        font-size: clamp(14px, 1.6vw, 18px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        font-family: VT323, ModeNine, monospace;
        font-weight: 400;
        font-size: clamp(56px, 13vw, 190px);
        line-height: 0.88;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }

      h1 .cursor {
        display: inline-block;
        width: 0.5em;
        height: 0.78em;
        margin-left: 0.08em;
        background: var(--ink);
        vertical-align: -0.02em;
        animation: blink 1.1s steps(1) infinite;
      }

      p.lead {
        max-width: 38ch;
        font-size: clamp(15px, 1.9vw, 22px);
        line-height: 1.5;
      }

      .bar {
        width: min(520px, 100%);
        font-family: VT323, monospace;
        font-size: clamp(20px, 2.4vw, 30px);
        line-height: 1;
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
        border: 2px solid var(--ink);
        padding: 8px 10px;
        border-radius: 999px;
      }
      .bar span { display: inline-block; animation: load 2.6s steps(20) infinite; overflow: hidden; vertical-align: bottom; }

      .status {
        font-size: clamp(12px, 1.3vw, 15px);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      @keyframes blink { 50% { opacity: 0; } }
      @keyframes load { from { width: 0; } to { width: 20ch; } }

      @media (prefers-reduced-motion: reduce) {
        h1 .cursor, .bar span { animation: none; }
        .bar span { width: 12ch; }
      }

      @media (max-width: 600px) {
        body::after { left: 14px; }
        main { padding-left: 34px; padding-right: 20px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">badprompt</div>
      <h1>Back<br />soon<span class="cursor" aria-hidden="true"></span></h1>
      <p class="lead">
        The site is down for scheduled technical maintenance. Everything will be
        back shortly &mdash; thank you for your patience.
      </p>
      <div class="bar" role="img" aria-label="Maintenance in progress"><span>▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮</span></div>
      <div class="status">Maintenance in progress</div>
    </main>
  </body>
</html>
